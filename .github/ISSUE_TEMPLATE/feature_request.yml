name: 功能建议
description: 提出新功能或改进现有体验的想法
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请尽量说明**使用场景**与**期望结果**，便于评估优先级与实现范围。

  - type: textarea
    id: problem
    attributes:
      label: 背景或痛点
      description: 当前遇到了什么不便，或缺少什么能力？
      placeholder: 例如：多驿站取件时很难区分同一快递公司的不同包裹…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望 App 如何表现（界面、流程、通知方式等）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式或临时变通办法
      placeholder: 选填

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 仅 UI / 交互
        - 本地数据与存储
        - 平台同步
        - 通知 / 实时活动
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意在 Issue 中补充更多细节或测试反馈
        - label: 如有需要，我可以尝试提交 Pull Request（请说明能力范围）