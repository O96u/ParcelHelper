name: Bug 报告
description: 反馈功能异常、同步失败、界面错误或崩溃等问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：**不要**粘贴真实姓名、完整地址、手机号、Cookie、Token、取件码或运单号。可改用 `138****1234`、`SF1234****5678` 等脱敏示例。

        若与某一 **Release 版本**相关，请写明标签（例如 `v1.2.0`）。

  - type: dropdown
    id: version
    attributes:
      label: 相关版本
      description: 出现问题时使用的 ParcelHelper 版本
      options:
        - 尚未安装 / 仅源码构建
        - v1.2.0
        - v1.2.1 或更高
        - 其他（请在下方补充）
    validations:
      required: true

  - type: input
    id: version_other
    attributes:
      label: 其他版本号
      description: 当上一步选择「其他」时填写，例如 v1.2.3 或 Xcode 本地构建
      placeholder: v1.2.x 或「Xcode 本地 Debug」

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - Xcode 本地运行
        - 自行签名后的 IPA
        - GitHub Release 未签名 IPA（重签名后安装）
        - 不确定
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 机型与 iOS 版本
      placeholder: 例如 iPhone 15 / iOS 17.2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开 App 到出现问题，按顺序列出操作
      placeholder: |
        1. 进入「设置」→ 授权淘宝
        2. 返回首页下拉刷新
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 你认为正确的表现应该是什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 实际看到的结果，如有错误提示请原文摘录（可脱敏）
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 平台同步（淘宝 / 京东 / 菜鸟 / 拼多多 / 丰巢 / 小米等）
        - 短信或剪贴板识别
        - 物流状态 / 轨迹显示
        - 通知或实时活动 / 灵动岛
        - 快捷指令
        - 崩溃或性能
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 截图、录屏链接、脱敏后的轨迹文本、是否必现等
      placeholder: 选填

  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已删除或脱敏所有个人敏感信息
          required: true
        - label: 我已搜索现有 Issues，确认未有完全相同的待处理报告
          required: true