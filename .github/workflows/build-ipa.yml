name: Build ParcelHelper IPA

# 正式版：推送 vMAJOR.MINOR.PATCH 标签 → Latest Release。
# 预发布：Actions 手动运行，默认使用仓库变量 PH_WIDGET_GROUP，可临时覆盖 → Pre-release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      widget_group:
        description: '可选：临时覆盖仓库变量 PH_WIDGET_GROUP（留空使用默认值）'
        required: false
        type: string
      base_ref:
        description: '要构建的分支或提交（默认 main）'
        required: false
        default: main
        type: string

concurrency:
  group: parcelhelper-${{ github.event_name == 'workflow_dispatch' && format('prerelease-{0}', github.run_id) || format('release-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # Xcode 26's iOS 26 SDK enables the native Liquid Glass navigation bars
    # on iOS 26. Xcode 16 builds retain the old visual style even on iOS 26.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: 检出源代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || github.ref }}

      - name: 写入构建摘要（中文）
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          {
            echo '# ParcelHelper IPA 构建'
            echo ''
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo '- **触发方式**: Actions 手动构建（预发布）'
              echo "- **构建分支/引用**: \`${{ inputs.base_ref }}\`"
            else
              echo "- **触发方式**: 版本标签 \`${GITHUB_REF_NAME}\`（正式 Latest）"
            fi
            echo "- **提交**: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 确定发版参数
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            latest_official="$(git tag --list 'v[0-9]*' --sort=-version:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [[ -z "$latest_official" ]]; then
              version="1.2.0"
              previous_tag=""
            else
              version="${latest_official#v}"
              previous_tag="$latest_official"
            fi
            IFS=. read -r major minor patch <<< "$version"
            build_number="$((10#${major:-1} * 1000000 + 10#${minor:-2} * 1000 + 10#${patch:-0} + GITHUB_RUN_NUMBER))"
            tag="v${version}-pre.${GITHUB_RUN_NUMBER}"
            echo "APP_VERSION=$version" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
            echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
            echo "PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"
            echo "预发布: ${tag} (营销版本 ${version}, 构建号 ${build_number})"
            {
              echo ''
              echo '## 版本信息'
              echo '- **类型**: 预发布 (Pre-release)，**不会**设为 Latest'
              echo "- **Release 标签**: \`${tag}\`"
              echo "- **营销版本**: \`${version}\`"
              echo "- **构建号**: \`${build_number}\`"
              echo "- **对照正式版**: \`${previous_tag:-无}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            tag="${GITHUB_REF_NAME}"
            if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::发版标签必须为 v主版本.次版本.修订号 (例如 v1.2.0), 当前为: ${tag}"
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if (( major == 1 && minor < 2 )); then
              echo "::error::发版线已从 v1.2.x 开始，请使用 v1.2.0 或更高标签（不再接受 v1.0.x / v1.1.x）。"
              exit 1
            fi
            version="${tag#v}"
            build_number="$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))"
            previous_tag="$(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              grep -Fxv "$tag" | head -n 1 || true)"
            echo "APP_VERSION=$version" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
            echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
            echo "PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"
            if [[ -z "$previous_tag" ]]; then
              previous_label="无"
            else
              previous_label="$previous_tag"
            fi
            echo "即将发版: ${tag} (构建号 ${build_number}), 上一版本: ${previous_label}"
            {
              echo ''
              echo '## 版本信息'
              echo '- **类型**: 正式版 (Latest)'
              echo "- **发版标签**: \`${tag}\`"
              echo "- **营销版本**: \`${version}\`"
              echo "- **构建号**: \`${build_number}\`"
              echo "- **上一标签**: \`${previous_label}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 解析 Widget App Group
        shell: bash
        env:
          REPOSITORY_WIDGET_GROUP: ${{ vars.PH_WIDGET_GROUP || secrets.PH_WIDGET_GROUP }}
          MANUAL_WIDGET_GROUP: ${{ inputs.widget_group }}
          IS_PRERELEASE: ${{ env.IS_PRERELEASE }}
        run: |
          set -euo pipefail
          if [[ "$IS_PRERELEASE" == "true" && -n "${MANUAL_WIDGET_GROUP:-}" ]]; then
            group="$MANUAL_WIDGET_GROUP"
            echo '- **App Group 来源**: 本次手动覆盖' >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "${REPOSITORY_WIDGET_GROUP:-}" ]]; then
            group="$REPOSITORY_WIDGET_GROUP"
            echo '- **App Group 来源**: 仓库变量或 Secret PH_WIDGET_GROUP' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "::error::请在仓库 Settings → Secrets and variables → Actions → Variables 配置 PH_WIDGET_GROUP（Variables 或 Secrets），或填写本次 widget_group。"
            exit 1
          else
            group="group.com.muxui.ParcelHelper"
            echo "::warning::使用示例 App Group；第三方证书的描述文件未包含该组时，小组件无法跨进程共享数据。"
            echo '- **注意**: 当前为示例 App Group；可在仓库变量 `PH_WIDGET_GROUP` 中配置默认值。' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ ! "$group" =~ ^group\.[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || [[ "$group" == *..* ]] || [[ "$group" == *. ]]; then
            echo "::error::无效的 App Group: ${group} (应为 group. 开头的合法标识)"
            exit 1
          fi
          echo "PH_WIDGET_GROUP=$group" >> "$GITHUB_ENV"
          echo "- **小组件 App Group**：\`$group\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::当前为未签名构建；主 App 与小组件扩展须各自使用包含 $group 的描述文件签名。"

      - name: 生成并校验深色主屏幕图标
        shell: bash
        run: |
          set -euo pipefail
          swift scripts/create_dark_icon.swift
          icon_dir="Resources/Assets.xcassets/AppIcon.appiconset"
          test -s "$icon_dir/AppIcon-Dark.png"
          if cmp -s "$icon_dir/AppIcon.png" "$icon_dir/AppIcon-Dark.png"; then
            echo "::error::深色图标与默认图标相同"
            exit 1
          fi
          jq -e 'any(.images[]; .filename == "AppIcon-Dark.png" and any(.appearances[]?; .appearance == "luminosity" and .value == "dark"))' "$icon_dir/Contents.json"
          sips -g pixelWidth -g pixelHeight "$icon_dir/AppIcon-Dark.png"
          shasum -a 256 "$icon_dir/AppIcon.png" "$icon_dir/AppIcon-Dark.png"

      - name: 校验 Xcode 26 与 iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          version="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          major="${version%%.*}"
          if [[ ! "$major" =~ ^[0-9]+$ ]] || (( major < 26 )); then
            echo "::error::需要 Xcode 26 或更高版本, 当前 Xcode ${version}"
            exit 1
          fi
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"
          if [[ ! "$sdk_major" =~ ^[0-9]+$ ]] || (( sdk_major < 26 )); then
            echo "::error::需要 iOS 26 SDK 或更高版本, 当前 ${sdk_version}"
            exit 1
          fi
          echo "工具链就绪: Xcode ${version}, iOS SDK ${sdk_version}"
          echo "- **Xcode**: ${version} · **iOS SDK**: ${sdk_version}" >> "$GITHUB_STEP_SUMMARY"
          xcodebuild -list -project ParcelHelper.xcodeproj

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 发布前离线回归测试
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          bash scripts/run-regression-tests.sh 2>&1 | tee build/regression-tests.log
          echo '- **离线回归测试**：通过' >> "$GITHUB_STEP_SUMMARY"

      - name: 编译主程序与 WidgetKit 扩展
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          echo '## 编译' >> "$GITHUB_STEP_SUMMARY"
          echo "正在编译营销版本 \`$APP_VERSION\` …" >> "$GITHUB_STEP_SUMMARY"
          xcodebuild \
            -jobs 2 \
            -resultBundlePath "$PWD/build/ParcelHelper.xcresult" \
            -project ParcelHelper.xcodeproj \
            -scheme ParcelHelper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PH_WIDGET_GROUP="$PH_WIDGET_GROUP" \
            build 2>&1 | tee build/xcodebuild.log

      - name: 校验产物并打包 IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/DerivedData/Build/Products/Release-iphoneos/ParcelHelper.app"
          WIDGET_PATH="$APP_PATH/PlugIns/ParcelHelperWidget.appex"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/ParcelHelper"
          test -d "$WIDGET_PATH"
          test -f "$WIDGET_PATH/Info.plist"
          test -f "$APP_PATH/Assets.car"
          # Save compiled appearance metadata for diagnosing iOS Home Screen icons.
          if command -v assetutil >/dev/null 2>&1; then
            assetutil --info "$APP_PATH/Assets.car" > build/asset-renditions.json
            if grep -Eiq 'dark' build/asset-renditions.json; then
              echo "已编译资源包含深色外观变体。"
            else
              echo "::warning::编译后的资源元数据中未发现深色外观，请检查 asset-renditions.json"
            fi
          fi
          for bundle in "$APP_PATH" "$WIDGET_PATH"; do
            for key in CFBundleShortVersionString CFBundleVersion; do
              test "$(/usr/libexec/PlistBuddy -c "Print :$key" "$bundle/Info.plist")" = "$([[ "$key" == CFBundleVersion ]] && echo "$BUILD_NUMBER" || echo "$APP_VERSION")"
            done
          done
          # Both Info.plists must reference the same group embedded at build time.
          # This checks the IPA's configuration, NOT the re-signed entitlements.
          for bundle in "$APP_PATH" "$WIDGET_PATH"; do
            actual_group="$(/usr/libexec/PlistBuddy -c 'Print :ParcelHelperWidgetGroup' "$bundle/Info.plist")"
            if [[ "$actual_group" != "$PH_WIDGET_GROUP" ]]; then
              echo "::error::小组件 App Group 不一致 (${bundle}): ${actual_group} != ${PH_WIDGET_GROUP}"
              exit 1
            fi
          done
          echo "- **嵌入 App Group**：主程序与小组件均为 \`$PH_WIDGET_GROUP\`" >> "$GITHUB_STEP_SUMMARY"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "com.muxui.ParcelHelper"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET_PATH/Info.plist")" = "com.muxui.ParcelHelper.widget"
          mkdir -p build/package/Payload
          ditto "$APP_PATH" build/package/Payload/ParcelHelper.app
          (cd build/package && /usr/bin/zip -qry ../ParcelHelper.ipa Payload)
          (cd build && shasum -a 256 ParcelHelper.ipa > ParcelHelper.ipa.sha256)
          echo "已生成未签名 ParcelHelper.ipa · 版本 $RELEASE_TAG · 构建号 $BUILD_NUMBER"
          {
            echo ''
            echo '## 打包结果'
            echo "- **安装包**：\`ParcelHelper.ipa\`（未签名）"
            echo "- **版本标签**：\`$RELEASE_TAG\`"
            echo "- **构建号**：\`$BUILD_NUMBER\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 IPA 工件
        uses: actions/upload-artifact@v4
        with:
          name: ParcelHelper-${{ env.RELEASE_TAG }}
          path: |
            build/ParcelHelper.ipa
            build/ParcelHelper.ipa.sha256
          if-no-files-found: error
          retention-days: 90

      - name: 生成中文版发行说明
        shell: bash
        env:
          IS_PRERELEASE: ${{ env.IS_PRERELEASE }}
          PH_WIDGET_GROUP: ${{ env.PH_WIDGET_GROUP }}
        run: |
          set -euo pipefail
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            {
              echo "# ParcelHelper ${RELEASE_TAG}"
              echo ""
              echo "## 预发布说明"
              echo "- 本次为 **Actions 手动预发布**，**不会**替代 [最新正式版](https://github.com/$GITHUB_REPOSITORY/releases/latest)。"
              echo "- 嵌入 App Group: \`${PH_WIDGET_GROUP}\`（来自仓库变量或本次手动覆盖）。"
              echo "- 构建引用: \`${{ inputs.base_ref }}\` · 提交 \`${GITHUB_SHA:0:7}\`"
              echo ""
              echo "## 安装说明"
              echo "- \`ParcelHelper.ipa\` 为未签名 IPA，须自行签名后安装。"
              echo "- 签名时主 App 与小组件扩展须使用包含上述 App Group 的描述文件。"
            } > build/release-notes.md
          else
            swift scripts/generate_release_notes.swift
          fi
          test -s build/release-notes.md
          echo '## 发行说明预览' >> "$GITHUB_STEP_SUMMARY"
          echo '```markdown' >> "$GITHUB_STEP_SUMMARY"
          cat build/release-notes.md >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build/release-notes.md

      - name: 发布 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ env.IS_PRERELEASE }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} 已存在；请勿重复推送同一标签，或先在 GitHub 上删除该 Release/标签后重试。"
            exit 1
          fi
          release_args=(
            "$RELEASE_TAG"
            build/ParcelHelper.ipa
            build/ParcelHelper.ipa.sha256
            --title "ParcelHelper ${RELEASE_TAG}"
            --notes-file build/release-notes.md
            --target "$GITHUB_SHA"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release create "${release_args[@]}" --prerelease
          else
            gh release create "${release_args[@]}" --latest
          fi
          {
            echo ''
            echo '## 发版完成'
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              echo '- **类型**: Pre-release（非 Latest）'
            else
              echo '- **类型**: 正式版 Latest'
            fi
            echo "- **Release**: [\`${RELEASE_TAG}\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/${RELEASE_TAG})"
            echo '- **附件**: `ParcelHelper.ipa`、`ParcelHelper.ipa.sha256`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 汇总编译错误（中文）
        if: failure()
        shell: bash
        run: |
          if [[ -f build/xcodebuild.log ]]; then
            {
              echo '## Xcode 编译错误摘要'
              echo '```text'
              grep -nE 'error:|\*\* BUILD FAILED \*\*|fatal error:' build/xcodebuild.log | tail -n 60 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Preserve one small failure report on a separate branch so diagnostics
      # can be inspected without the Actions run/job numeric IDs.
      - name: 保存最新失败诊断
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build
          report="build/ci-failure.txt"
          {
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Date: $(date -u +%FT%TZ)"
            echo
            echo "Error excerpts:"
            if [[ -f build/xcodebuild.log ]]; then
              grep -nE 'error:|fatal error:|\*\* BUILD FAILED \*\*|Error:|failed with exit code' build/xcodebuild.log | tail -n 100 || true
            else
              echo "No xcodebuild.log: failure happened before/during another step."
            fi
          } > "$report"

          branch="ci-diagnostics"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" >/dev/null
          fi

          remote="repos/$GITHUB_REPOSITORY/contents/.ci/latest-failure.txt"
          old_sha="$(gh api "$remote?ref=$branch" --jq .sha 2>/dev/null || true)"
          payload="$(base64 < "$report" | tr -d '\n')"
          if [[ -n "$old_sha" ]]; then
            jq -n --arg message "ci: save latest failure report" \
              --arg branch "$branch" --arg content "$payload" --arg sha "$old_sha" \
              '{message:$message,branch:$branch,content:$content,sha:$sha}' |
              gh api -X PUT "$remote" --input - >/dev/null
          else
            jq -n --arg message "ci: save latest failure report" \
              --arg branch "$branch" --arg content "$payload" \
              '{message:$message,branch:$branch,content:$content}' |
              gh api -X PUT "$remote" --input - >/dev/null
          fi

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ParcelHelper-build-log
          path: |
            build/xcodebuild.log
            build/ParcelHelper.xcresult/
            build/asset-renditions.json
          if-no-files-found: ignore
          retention-days: 14

  telegram-notify:
    name: 通知 Telegram 构建结果
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: 检出通知脚本
        uses: actions/checkout@v4
        with:
          ref: main
      - name: 下载成功构建的 IPA
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: ParcelHelper-v*
          path: telegram-ipa
          merge-multiple: true
      - name: 发送 Telegram 消息与 IPA 附件
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: python3 scripts/telegram_notify.py
