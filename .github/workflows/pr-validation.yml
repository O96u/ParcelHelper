name: PR Swift Build

on:
  pull_request:
    branches: [main]
    paths:
      - "App/**"
      - "Shared/**"
      - "Tests/**"
      - "scripts/**"
      - "Widget/**"
      - "Resources/**"
      - "ParcelHelper.xcodeproj/**"
      - ".github/workflows/pr-validation.yml"
      - "CHANGELOG.md"
  workflow_dispatch:

# Never sign or publish a release from a PR validation build.
permissions:
  contents: read

concurrency:
  group: parcelhelper-pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile iOS App + Widget (unsigned)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Require Chinese CHANGELOG for source PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_BRANCH"
          changed="$(git diff --name-only FETCH_HEAD HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(App|Shared|Widget|Resources|scripts)/'; then
            if ! printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
              echo "::error::源码改动请同步更新 CHANGELOG.md 的「未发布」中文记录。"
              exit 1
            fi
          fi
      - name: Check release-notes generator
        run: |
          swift scripts/generate_release_notes.swift
          test -s build/release-notes.md
      - name: Generate dark App Icon like release workflow
        run: swift scripts/create_dark_icon.swift
      - name: Run pure Swift model regression tests
        run: |
          swiftc -parse-as-library Shared/Models.swift Tests/ParcelModelTests.swift -o "${RUNNER_TEMP}/parcel-model-tests"
          "${RUNNER_TEMP}/parcel-model-tests"
      - name: Verify app and widget compile
        run: |
          set -o pipefail
          xcodebuild \
            -project ParcelHelper.xcodeproj \
            -scheme ParcelHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/ParcelHelperDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
